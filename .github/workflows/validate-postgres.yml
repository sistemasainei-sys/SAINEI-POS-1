name: Validate SAINEI POS PostgreSQL backend
on:
  pull_request:
    branches: [main]
  push:
    branches: [migracion-postgresql]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server-postgres.js
      - run: node --check server.js
