name: SAINEI POS - paquete Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'server.js'
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - '*.bat'
      - '*.ps1'
      - '*.vbs'
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'package.json'
      - 'docs/INICIO-SIN-COSTO-WINDOWS.md'
      - '.github/workflows/windows-installer-package.yml'
  push:
    branches: [main]
    paths:
      - 'server.js'
      - 'public/**'
      - 'src/**'
      - 'scripts/**'
      - '*.bat'
      - '*.ps1'
      - '*.vbs'
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'package.json'
      - 'docs/INICIO-SIN-COSTO-WINDOWS.md'
      - '.github/workflows/windows-installer-package.yml'

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Validar versión de Node
        run: node --version

      - name: Ejecutar pruebas del proyecto
        run: npm test

      - name: Preparar carpeta instalable
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'SAINEI-POS-Windows'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          git archive HEAD | tar -x -C $out
          if (!(Test-Path (Join-Path $out '1-INSTALAR.bat'))) { throw 'Falta 1-INSTALAR.bat en el paquete.' }
          if (!(Test-Path (Join-Path $out 'server.js'))) { throw 'Falta server.js en el paquete.' }
          if (!(Test-Path (Join-Path $out 'index.html'))) { throw 'Falta index.html en el paquete.' }
          "Paquete SAINEI POS preparado: $out"

      - name: Publicar paquete Windows
        uses: actions/upload-artifact@v4
        with:
          name: SAINEI-POS-Windows
          path: ${{ runner.temp }}/SAINEI-POS-Windows/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
