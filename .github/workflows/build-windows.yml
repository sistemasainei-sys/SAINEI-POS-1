name: Build SAINEI POS for Windows
on:
  push:
    branches:
      - sainei-pos-independiente-sin-licencia
    paths:
      - 'server.js'
      - 'index.html'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'sainei-mod-*.js'
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop build tools
        working-directory: desktop
        run: npm install
      - name: Build installer
        working-directory: desktop
        run: npm run build:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SAINEI-POS-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
